id = "rcosteira.readpending"
name = "Read Pending"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Mark agents you haven't finished reading. Numbered badge ($read) + a reorderable list pane. Auto-clears when you focus the agent."
platforms = ["macos", "linux"]

# Toggle read-pending on the focused agent. `pane` context so it is eligible
# for the right-click pane menu; also bind a key (see README) as the sure path.
[[actions]]
id = "toggle"
title = "Read pending: toggle on focused agent"
command = ["python3", "readpending.py", "toggle"]
contexts = ["pane"]

# Open the reorderable list of pending agents.
[[actions]]
id = "open-list"
title = "Read pending: open list"
command = ["python3", "readpending.py", "open-list"]
contexts = ["global"]

# The list pane itself (opened by the action above or `herdr plugin pane open`).
[[panes]]
id = "list"
title = "Read Pending"
command = ["python3", "readpending.py", "ui"]
placement = "overlay"

# Daemon wake-up hooks. Neither clears anything — the poll daemon does that.
# Both hooks have one job: ensure the daemon stays alive. pane.focused restarts
# a dead daemon at the moment the reader opens an agent inside a workspace.
# pane.agent_status_changed is the most frequent trigger herdr publishes
# reliably, because herdr publishes no startup or lifecycle event a manifest
# can hook. See docs/adr/0001-poll-for-focus-not-events.md.
#
# Spell the event with dots. herdr's API schema lists the same kinds with
# underscores, and the manifest turns `pane_focused` down with "unknown event"
# — and it turns down the manifest, not just the one hook.
#
# That rejection is why min_herdr_version says 0.9.0 rather than 0.8.2. A
# manifest event hook was confirmed to load on 0.8.2, but that was one hook:
# pane.focused. pane.agent_status_changed is only evidenced on 0.9.0, and an
# unknown event name there would cost a 0.8.2 user the whole plugin, not one
# degraded hook. The floor tracks the weaker-evidenced event, deliberately.
[[events]]
on = "pane.focused"
command = ["python3", "readpending.py", "ensure-daemon"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "readpending.py", "ensure-daemon"]
