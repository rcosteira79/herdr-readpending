id = "rcosteira.readpending"
name = "Read Pending"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Mark agents you haven't finished reading. Numbered badge ($read) + a reorderable list pane. Auto-clears when you focus the agent."
platforms = ["macos", "linux"]

# Toggle read-pending on the focused agent. `pane` context so it is eligible
# for the right-click pane menu; also bind a key (see README) as the sure path.
[[actions]]
id = "toggle"
title = "Read pending: toggle on focused agent"
command = ["python3", "readpending.py", "toggle"]
contexts = ["pane"]

# Open the reorderable list of pending agents.
[[actions]]
id = "open-list"
title = "Read pending: open list"
command = ["python3", "readpending.py", "open-list"]
contexts = ["global"]

# The list pane itself (opened by the action above or `herdr plugin pane open`).
[[panes]]
id = "list"
title = "Read Pending"
command = ["python3", "readpending.py", "ui"]
placement = "overlay"

# No auto-clear-on-focus hook yet, but herdr does support one. The earlier note
# here said the plugin-hook allowlist accepts no pane event name. That was the
# wrong spelling, not a missing feature: the allowlist wants dots, and herdr's
# API schema lists the same kinds with underscores. `pane_focused` warns
# "unknown event"; `pane.focused` loads and fires. Verified on herdr 0.8.2.
#
#   [[events]]
#   on = "pane.focused"
#   command = ["python3", "readpending.py", "clear"]
#
# Until that is wired, auto-clear is handled by the list pane while it is open.
