id = "rcosteira.readpending"
name = "Read Pending"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Mark agents you haven't finished reading. Numbered badge ($read) + a reorderable list pane. Auto-clears when you focus the agent."
platforms = ["macos", "linux"]

# Toggle read-pending on the focused agent. `pane` context so it is eligible
# for the right-click pane menu; also bind a key (see README) as the sure path.
[[actions]]
id = "toggle"
title = "Read pending: toggle on focused agent"
command = ["python3", "readpending.py", "toggle"]
contexts = ["pane"]

# Open the reorderable list of pending agents.
[[actions]]
id = "open-list"
title = "Read pending: open list"
command = ["python3", "readpending.py", "open-list"]
contexts = ["global"]

# The list pane itself (opened by the action above or `herdr plugin pane open`).
[[panes]]
id = "list"
title = "Read Pending"
command = ["python3", "readpending.py", "ui"]
placement = "overlay"

# Auto-clear-on-focus. herdr runs this on every focus change, naming the pane
# that gained focus; the command drops that pane from the queue if it is in it.
#
# Spell the event with dots. herdr's API schema lists the same kinds with
# underscores, and the manifest turns `pane_focused` down with "unknown event".
# That spelling is why an earlier note here said no pane event was accepted.
# Verified on herdr 0.8.2, which is why min_herdr_version says 0.8.2.
[[events]]
on = "pane.focused"
command = ["python3", "readpending.py", "on-focus"]
